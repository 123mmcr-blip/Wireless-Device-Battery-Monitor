name: PR safety check

# Flags things this app should never contain (network access, launching programs, keylogging,
# startup entries, binaries, build/release pipeline changes) so the reviewer knows which lines to
# read carefully. Results appear in the check's summary.
#
# Security: pull_request_target runs the scanner from the main branch, so a pull request cannot
# switch it off by editing it. The PR's code is only downloaded as a text diff; it is never
# checked out, built or run here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, main branch only
      - name: Download the pull request's changes as text
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"
      - name: Scan for red flags
        run: bash scripts/pr-safety.sh "$RUNNER_TEMP/pr.diff"
